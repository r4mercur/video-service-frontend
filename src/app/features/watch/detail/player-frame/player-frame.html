<div class="player">
  <span class="player__label">PLAYER — VIDEO FRAME</span>
  <span class="player__play-button" aria-hidden="true">
    <span class="player__play-icon"></span>
  </span>
  <div class="player__controls">
    <div class="player__track">
      <div class="player__fill" [style.width.%]="progressPercent()"></div>
    </div>
    <div class="player__row">
      <span>{{ positionSeconds() | appDuration }} / {{ durationSeconds() | appDuration }}</span>
      <div class="player__actions">
        <span>Subtitles</span>
        <span>{{ quality() }}</span>
        <span>Volume</span>
        <span>Full screen</span>
      </div>
    </div>
  </div>
</div>
