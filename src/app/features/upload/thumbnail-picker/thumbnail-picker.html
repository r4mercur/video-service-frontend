<div class="thumbnail-picker">
  <input
    #fileInput
    type="file"
    class="thumbnail-picker__input"
    accept="image/jpeg,image/png,image/webp"
    aria-label="Custom thumbnail image"
    (change)="onFileInputChange($event)"
  />

  <div
    class="thumbnail-picker__preview"
    [class.thumbnail-picker__preview--empty]="!previewUrl()"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
  >
    @if (previewUrl(); as url) {
      <img [src]="url" alt="" class="thumbnail-picker__image" />
    } @else {
      <span class="thumbnail-picker__placeholder" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
          />
          <path
            d="M4 16l4.5-6 3 4 2.5-3L20 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    }
  </div>

  <div class="thumbnail-picker__actions">
    <button type="button" class="thumbnail-picker__choose" (click)="openPicker()">
      {{ previewUrl() ? 'Change image' : 'Choose image' }}
    </button>
    @if (previewUrl()) {
      <button type="button" class="thumbnail-picker__remove" (click)="clear()">Remove</button>
    }
  </div>
</div>
