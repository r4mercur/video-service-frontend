<dialog #dialogEl class="age-gate-dialog" (cancel)="onCancel($event)">
  <div class="age-gate-dialog__panel">
    <h2 class="age-gate-dialog__title" i18n>Age verification</h2>
    <p class="age-gate-dialog__description" i18n>
      This platform may host videos not suitable for viewers under 18. You must confirm you are at
      least 18 years old to continue.
    </p>

    <div class="age-gate-dialog__actions">
      <button type="button" class="age-gate-dialog__decline" (click)="onDecline()" i18n>
        No, I'm not
      </button>
      <button type="button" class="age-gate-dialog__confirm" (click)="onConfirm()" i18n>
        Yes, I'm 18 or older
      </button>
    </div>
  </div>
</dialog>
