<header class="header">
  <div class="header__start">
    <a
      class="header__brand"
      routerLink="/catalog"
      aria-label="Video Platform – home"
      i18n-aria-label
    >
      <span class="header__mark" aria-hidden="true">V</span>
      <span class="header__wordmark">Video Platform</span>
    </a>
    <!-- Below sm the links collapse to icons (see scss): the signed-in admin header does not fit
         its own row on 320-375px phones otherwise. The aria-label carries the name either way. -->
    <nav class="header__nav" aria-label="Main">
      <a
        routerLink="/catalog"
        routerLinkActive="header__link--active"
        ariaCurrentWhenActive="page"
        aria-label="Browse"
        i18n-aria-label
      >
        <svg
          class="header__link-icon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <path
            d="M3.5 11.5 12 4l8.5 7.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M6 11v8h12v-8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="header__link-label" i18n>Browse</span>
      </a>
      @if (isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="header__link--active"
          ariaCurrentWhenActive="page"
          aria-label="Admin"
          i18n-aria-label
        >
          <svg
            class="header__link-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M12 3.5 5.5 6v5.5c0 4 2.8 7.2 6.5 8.5 3.7-1.3 6.5-4.5 6.5-8.5V6L12 3.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
          <span class="header__link-label" i18n>Admin</span>
        </a>
      }
    </nav>
  </div>
  <!-- From md upward: inline field. Below md: icon link to the search page (header width, see scss). -->
  <app-search-box
    class="header__search"
    inputId="header-search"
    [query]="searchQuery()"
    (searched)="search($event)"
  />
  <div class="header__end">
    <a
      class="header__search-link"
      routerLink="/catalog/search"
      routerLinkActive="header__search-link--active"
      aria-label="Search videos"
      i18n-aria-label
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
        <path
          d="m20 20-3.5-3.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </a>
    @if (isAuthenticated()) {
      <nav class="header__nav" aria-label="Account">
        <a
          routerLink="/upload"
          routerLinkActive="header__link--active"
          ariaCurrentWhenActive="page"
          aria-label="Upload"
          i18n-aria-label
        >
          <svg
            class="header__link-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M12 4.5v10"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="m7.5 9 4.5-4.5L16.5 9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5 19h14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span class="header__link-label" i18n>Upload</span>
        </a>
        <a
          routerLink="/studio"
          routerLinkActive="header__link--active"
          ariaCurrentWhenActive="page"
          aria-label="Studio"
          i18n-aria-label
        >
          <svg
            class="header__link-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <rect
              x="3.5"
              y="5.5"
              width="17"
              height="13"
              rx="2.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path d="m10.5 9.5 5 2.5-5 2.5Z" fill="currentColor" />
          </svg>
          <span class="header__link-label" i18n>Studio</span>
        </a>
      </nav>
      <button
        type="button"
        class="header__signout"
        (click)="signOut()"
        aria-label="Sign out"
        i18n-aria-label
      >
        <svg
          class="header__link-icon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <path
            d="M12 4v7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M7.8 7.2a6.5 6.5 0 1 0 8.4 0"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span class="header__link-label" i18n>Sign out</span>
      </button>
      <button
        #avatarButton
        type="button"
        class="header__avatar"
        aria-haspopup="dialog"
        aria-label="Change profile photo"
        i18n-aria-label
        (click)="openPhotoDialog()"
      >
        <app-avatar [name]="username()" [src]="avatarUrl()" />
      </button>
      <!-- Loaded on first use only: the dialog is rarely opened and must not grow the initial bundle. -->
      @defer (on interaction(avatarButton); prefetch on hover(avatarButton)) {
        <app-profile-photo-dialog [open]="photoDialogOpen()" (closed)="closePhotoDialog()" />
      }
    } @else {
      <a class="header__signout" routerLink="/auth">Log in</a>
    }
  </div>
</header>
