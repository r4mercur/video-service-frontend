<header class="header">
  <div class="header__start">
    <a class="header__brand" routerLink="/catalog">
      <span class="header__mark">S</span>
      <span class="header__wordmark">Streambox</span>
    </a>
    <nav class="header__nav" aria-label="Main">
      <a routerLink="/catalog" routerLinkActive="header__link--active">Browse</a>
      @if (isAuthenticated()) {
        <a routerLink="/upload" routerLinkActive="header__link--active">Upload</a>
      }
    </nav>
  </div>
  <div class="header__end">
    @if (isAuthenticated()) {
      <button type="button" class="header__signout" (click)="signOut()">Sign out</button>
      <app-avatar [initials]="initials()" />
    } @else {
      <a class="header__signout" routerLink="/auth">Log in</a>
    }
  </div>
</header>
