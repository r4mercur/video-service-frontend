<header class="header">
  <div class="header__start">
    <a class="header__brand" routerLink="/catalog">
      <span class="header__mark">S</span>
      <span class="header__wordmark">sol-stream</span>
    </a>
    <nav class="header__nav" aria-label="Main">
      <a routerLink="/catalog" routerLinkActive="header__link--active" ariaCurrentWhenActive="page"
        >Browse</a
      >
      @if (isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="header__link--active"
          ariaCurrentWhenActive="page"
          i18n
          >Admin</a
        >
      }
    </nav>
  </div>
  <!-- From md upward: inline field. Below md: icon link to the search page (header width, see scss). -->
  <app-search-box
    class="header__search"
    inputId="header-search"
    [query]="searchQuery()"
    (searched)="search($event)"
  />
  <div class="header__end">
    <a
      class="header__search-link"
      routerLink="/catalog/search"
      routerLinkActive="header__search-link--active"
      aria-label="Search videos"
      i18n-aria-label
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
        <path
          d="m20 20-3.5-3.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </a>
    @if (isAuthenticated()) {
      <nav class="header__nav" aria-label="Account">
        <a routerLink="/upload" routerLinkActive="header__link--active" ariaCurrentWhenActive="page"
          >Upload</a
        >
        <a routerLink="/studio" routerLinkActive="header__link--active" ariaCurrentWhenActive="page"
          >Studio</a
        >
      </nav>
      <button type="button" class="header__signout" (click)="signOut()">Sign out</button>
      <app-avatar [initials]="initials()" />
    } @else {
      <a class="header__signout" routerLink="/auth">Log in</a>
    }
  </div>
</header>
